[profile.dev.build-override]
debug = true

[package]
name = "wvk"
version = "0.0.0"
edition = "2021"

[lib]
path = "_mods.rs"

[features]
default = ["vulkan_1_0"]

vulkan_1_0 = []
vulkan_1_1 = ["vulkan_1_0"]
vulkan_1_2 = ["vulkan_1_1"]
vulkan_1_3 = ["vulkan_1_2"]
vulkan_1_4 = ["vulkan_1_3"]

VK_EXT_debug_utils = []

[dependencies]
common = {
    version = "0.0.0",
    path = "../common",
}

svk = {
    version = "0.0.0",
    path = "../sdk_vulkan",
}

windows = { 
    version = "0.62.2",
    features = [
        "Win32_System_LibraryLoader"
    ]
}